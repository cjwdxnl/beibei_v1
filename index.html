<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>倍倍 v1.5</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #e0f7f5 0%, #d0f0ec 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .converter-card {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .header {
            background: #39c5bb;
            padding: 24px 24px 20px 24px;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #39c5bb, #2aa89e);
        }

        .header h1 {
            margin: 0 0 6px 0;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header p {
            margin: 0;
            opacity: 0.85;
            font-size: 0.85rem;
        }

        .dropzone {
            margin: 20px 20px 0 20px;
            background: #f0fbf9;
            border: 2px dashed #9de0d8;
            border-radius: 32px;
            padding: 28px 16px;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .dropzone.drag-over {
            background: #dcf5f1;
            border-color: #39c5bb;
            transform: scale(0.99);
        }

        .dropzone-icon {
            font-size: 44px;
            margin-bottom: 12px;
        }

        .dropzone-text {
            font-weight: 500;
            color: #2c8b82;
            margin-bottom: 10px;
        }

        .dropzone-sub {
            font-size: 0.75rem;
            color: #5ea79f;
        }

        .file-select-btn {
            background: #39c5bb;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .file-select-btn:active {
            background: #2aa89e;
        }

        .audio-info {
            background: #ffffffdd;
            margin: 18px 20px 0 20px;
            padding: 12px 16px;
            border-radius: 28px;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .audio-info.hidden {
            display: none;
        }

        .file-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2c7a6f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }

        .duration-badge {
            background: #e0f5f2;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #39c5bb;
        }

        .speed-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 20px 12px 20px;
        }

        .speed-btn {
            flex: 1 0 auto;
            min-width: 70px;
            background: #eaf9f7;
            border: none;
            padding: 10px 0;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            color: #2d8a7f;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .speed-btn.active {
            background: #39c5bb;
            color: white;
            box-shadow: 0 6px 12px -8px rgba(57,197,187,0.5);
        }

        .play-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 10px 20px 16px 20px;
        }

        .ctrl-btn {
            background: white;
            border: 1px solid #b8e3db;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: #2a9b8f;
        }

        .ctrl-btn:active {
            transform: scale(0.96);
            background: #f0fcf9;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 12px 20px 28px 20px;
        }

        .action-btn {
            flex: 1;
            background: #f2fbf9;
            border: 1px solid #c2e5df;
            border-radius: 50px;
            padding: 12px 10px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #338b7f;
        }

        .action-btn.primary {
            background: #39c5bb;
            border-color: #39c5bb;
            color: white;
            box-shadow: 0 4px 8px rgba(57,197,187,0.25);
        }

        .action-btn.primary:active {
            background: #2aa89e;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #2aa89ee6;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
        }

        .loading-overlay.visible {
            visibility: visible;
        }

        .loading-spinner {
            background: white;
            padding: 24px 32px;
            border-radius: 48px;
            display: flex;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            color: #39c5bb;
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }
            .ctrl-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .action-btn {
                font-size: 0.8rem;
            }
            .speed-btn {
                font-size: 0.9rem;
                min-width: 60px;
            }
            .file-name {
                max-width: 140px;
            }
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #7dbeb5;
            margin: 10px 0 18px;
        }

        button {
            background: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <div class="header">
        <h1>倍倍</h1>
        <p>created by 超级无敌小南梁</p>
    </div>

    <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📂</div>
        <div class="dropzone-text">点一下 或者 拖进来</div>
        <div class="dropzone-sub">修改了114514个bug</div>
        <button class="file-select-btn" id="fileSelectBtn">上传</button>
        <input type="file" id="fileInput" accept="audio/*" style="display: none;">
    </div>

    <div class="audio-info hidden" id="audioInfoArea">
        <span class="file-name" id="fileName">-</span>
        <span class="duration-badge" id="durationDisplay">0:00</span>
    </div>

    <div class="speed-buttons">
        <button class="speed-btn" data-rate="1.0">😄1.0x</button>
        <button class="speed-btn" data-rate="1.25">🤨1.25x</button>
        <button class="speed-btn" data-rate="1.5">😨1.5x</button>
        <button class="speed-btn" data-rate="2.0">😡2.0x</button>
    </div>

    <div class="play-controls">
        <button class="ctrl-btn" id="playBtn">我听听</button>
        <button class="ctrl-btn" id="stopBtn">停停停</button>
    </div>

    <div class="action-buttons">
        <button class="action-btn" id="exportBtn">先甩到本地</button>
        <button class="action-btn primary" id="shareBtn">分你一个梨</button>
    </div>
    <footer>关注塔菲喵<br/>关注塔菲谢谢喵</footer>
</div>

<div id="loadingToast" class="loading-overlay">
    <div class="loading-spinner">你先喝口水等一会……</div>
</div>
<div id="messageToast" class="toast-msg"></div>

<script>
    (function(){
        // DOM 元素
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileSelectBtn = document.getElementById('fileSelectBtn');
        const audioInfoArea = document.getElementById('audioInfoArea');
        const fileNameSpan = document.getElementById('fileName');
        const durationSpan = document.getElementById('durationDisplay');
        const speedBtns = document.querySelectorAll('.speed-btn');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportBtn = document.getElementById('exportBtn');
        const shareBtn = document.getElementById('shareBtn');
        const loadingOverlay = document.getElementById('loadingToast');
        const toastMsgDiv = document.getElementById('messageToast');

        // 全局变量
        let audioContext = null;
        let originalBuffer = null;
        let currentRate = 1.0;
        let currentSource = null;
        let currentFileName = "audiooooo";
        let currentFileType = "audio/mpeg";

        // 显示Toast
        function showMessage(msg, duration = 2500) {
            toastMsgDiv.textContent = msg;
            toastMsgDiv.classList.add('show');
            setTimeout(() => {
                toastMsgDiv.classList.remove('show');
            }, duration);
        }

        function showLoading(show) {
            if (show) {
                loadingOverlay.classList.add('visible');
            } else {
                loadingOverlay.classList.remove('visible');
            }
        }

        function initAudioContext() {
            if (audioContext) return audioContext;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                return audioContext;
            } catch(e) {
                console.error(e);
                showMessage("浏览器拉爆了👎");
                return null;
            }
        }

        async function resumeAudioContext() {
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }
        }

        function stopCurrentPlayback() {
            if (currentSource) {
                try {
                    currentSource.stop();
                } catch(e) {}
                currentSource = null;
            }
        }

        async function playPreview() {
            if (!originalBuffer) {
                showMessage("找不到音频");
                return;
            }
            await resumeAudioContext();
            if (!audioContext) return;
            stopCurrentPlayback();
            const source = audioContext.createBufferSource();
            source.buffer = originalBuffer;
            source.playbackRate.value = currentRate;
            source.connect(audioContext.destination);
            source.start();
            currentSource = source;
            source.onended = () => {
                if (currentSource === source) currentSource = null;
            };
            showMessage(`以 ${currentRate}x `, 1800);
        }

        function stopPreview() {
            if (!originalBuffer) {
                showMessage("没有音频");
                return;
            }
            stopCurrentPlayback();
            showMessage("停了", 1200);
        }

        function formatDuration(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2,'0')}`;
        }

        async function loadAudioFile(file) {
            if (!file) return;
            stopCurrentPlayback();
            currentFileName = file.name || "audio";
            fileNameSpan.textContent = currentFileName.length > 30 ? currentFileName.slice(0,27)+"..." : currentFileName;
            currentFileType = file.type || "audio/mpeg";
            showLoading(true);
            try {
                const arrayBuffer = await file.arrayBuffer();
                const ctx = initAudioContext();
                if (!ctx) throw new Error("耶？！");
                const decoded = await ctx.decodeAudioData(arrayBuffer);
                originalBuffer = decoded;
                const durationSec = decoded.duration;
                durationSpan.textContent = formatDuration(durationSec);
                audioInfoArea.classList.remove('hidden');
                showMessage(`OK ${currentFileName} (${formatDuration(durationSec)})`, 2000);
                const activeSpeed = document.querySelector('.speed-btn.active');
                if (activeSpeed) {
                    currentRate = parseFloat(activeSpeed.getAttribute('data-rate'));
                } else {
                    document.querySelector('.speed-btn[data-rate="1.0"]').classList.add('active');
                    currentRate = 1.0;
                }
            } catch (err) {
                console.error(err);
                showMessage("你上传的这啥玩意啊");
                audioInfoArea.classList.add('hidden');
                originalBuffer = null;
            } finally {
                showLoading(false);
            }
        }

        // 高精度重采样变速（三次Hermite插值，音质清晰）
        function resampleAudioBuffer(sourceBuffer, rate) {
            if (!sourceBuffer) throw new Error("滚木");
            if (rate <= 0) rate = 1.0;
            const numberOfChannels = sourceBuffer.numberOfChannels;
            const sampleRate = sourceBuffer.sampleRate;
            const originalLength = sourceBuffer.length;
            const newLength = Math.max(1, Math.floor(originalLength / rate));
            const newBuffer = new AudioBuffer({
                numberOfChannels: numberOfChannels,
                length: newLength,
                sampleRate: sampleRate
            });
            
            for (let ch = 0; ch < numberOfChannels; ch++) {
                const channelData = sourceBuffer.getChannelData(ch);
                const newData = newBuffer.getChannelData(ch);
                for (let i = 0; i < newLength; i++) {
                    const srcPos = i * rate;
                    const srcIdx = Math.floor(srcPos);
                    const frac = srcPos - srcIdx;
                    
                    if (srcIdx + 1 < originalLength) {
                        // 三次hermite插值 (更平滑)
                        const x0 = channelData[Math.max(0, srcIdx - 1)];
                        const x1 = channelData[srcIdx];
                        const x2 = channelData[Math.min(originalLength - 1, srcIdx + 1)];
                        const x3 = channelData[Math.min(originalLength - 1, srcIdx + 2)];
                        
                        const a = ( -0.5 * x0 + 1.5 * x1 - 1.5 * x2 + 0.5 * x3 );
                        const b = ( x0 - 2.5 * x1 + 2 * x2 - 0.5 * x3 );
                        const c = ( -0.5 * x0 + 0.5 * x2 );
                        const d = x1;
                        
                        newData[i] = a * frac * frac * frac + b * frac * frac + c * frac + d;
                    } else if (srcIdx < originalLength) {
                        newData[i] = channelData[srcIdx];
                    } else {
                        newData[i] = 0;
                    }
                }
            }
            return newBuffer;
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;
            let samples = buffer.length;
            let dataLength = samples * numChannels * (bitDepth / 8);
            const bufferLength = 44 + dataLength;
            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);
            function writeString(offset, str) {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            }
            writeString(0, 'RIFF');
            view.setUint32(4, bufferLength - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            const byteRate = sampleRate * numChannels * (bitDepth / 8);
            view.setUint32(28, byteRate, true);
            const blockAlign = numChannels * (bitDepth / 8);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);
            let offset = 44;
            for (let i = 0; i < samples; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = buffer.getChannelData(ch)[i];
                    sample = Math.max(-1, Math.min(1, sample));
                    const intSample = sample * 0x7FFF;
                    view.setInt16(offset, intSample, true);
                    offset += 2;
                }
            }
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        async function exportSpeedAudio(saveOrShare = 'download') {
            if (!originalBuffer) {
                showMessage("没有音频");
                return null;
            }
            showLoading(true);
            try {
                const rate = currentRate;
                let wavBlob;
                if (Math.abs(rate - 1.0) < 0.001) {
                    wavBlob = audioBufferToWav(originalBuffer);
                } else {
                    const resampled = resampleAudioBuffer(originalBuffer, rate);
                    wavBlob = audioBufferToWav(resampled);
                }
                const baseFileName = currentFileName.replace(/\.[^/.]+$/, '') || 'audio';
                const exportFileName = `${baseFileName}_${rate}x.wav`;
                if (saveOrShare === 'download') {
                    const downloadLink = document.createElement('a');
                    const url = URL.createObjectURL(wavBlob);
                    downloadLink.href = url;
                    downloadLink.download = exportFileName;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                    URL.revokeObjectURL(url);
                    showMessage(`已导出 ${rate}x `, 2000);
                }
                return { blob: wavBlob, fileName: exportFileName };
            } catch (err) {
                console.error(err);
                showMessage("导出失败了");
                return null;
            } finally {
                showLoading(false);
            }
        }

        async function shareAudioFile() {
            if (!originalBuffer) {
                showMessage("先上传个");
                return;
            }
            if (!navigator.share || !navigator.canShare) {
                showMessage("分享不行，甩本地了", 2000);
                await exportSpeedAudio('download');
                return;
            }
            showLoading(true);
            try {
                const rate = currentRate;
                let shareBlob;
                let finalFileName;
                if (Math.abs(rate - 1.0) < 0.001) {
                    shareBlob = audioBufferToWav(originalBuffer);
                    finalFileName = `${currentFileName.replace(/\.[^/.]+$/, '')}_原速.wav`;
                } else {
                    const resampled = resampleAudioBuffer(originalBuffer, rate);
                    shareBlob = audioBufferToWav(resampled);
                    finalFileName = `${currentFileName.replace(/\.[^/.]+$/, '')}_${rate}x.wav`;
                }
                const fileObj = new File([shareBlob], finalFileName, { type: 'audio/wav' });
                if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
                    await navigator.share({
                        title: '倍倍',
                        text: `${currentFileName} · ${rate}x `,
                        files: [fileObj]
                    });
                    showMessage("OKK", 1500);
                } else {
                    const link = document.createElement('a');
                    const url = URL.createObjectURL(shareBlob);
                    link.href = url;
                    link.download = finalFileName;
                    link.click();
                    URL.revokeObjectURL(url);
                    showMessage("甩本地了", 2000);
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    showMessage("分享了滚木，已甩本地");
                    await exportSpeedAudio('download');
                }
            } finally {
                showLoading(false);
            }
        }

        // 拖拽与文件选择
        function setupDragAndDrop() {
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('drag-over');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('drag-over');
            });
            dropzone.addEventListener('drop', async (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type.includes('audio')) {
                    await loadAudioFile(files[0]);
                } else {
                    showMessage("音频呢？！");
                }
            });
            dropzone.addEventListener('click', (e) => {
                if (e.target === fileSelectBtn || e.target.closest('.file-select-btn')) return;
                fileInput.click();
            });
            fileSelectBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                fileInput.click();
            });
            fileInput.addEventListener('change', async (e) => {
                if (e.target.files && e.target.files[0]) {
                    await loadAudioFile(e.target.files[0]);
                }
                fileInput.value = '';
            });
        }

        function bindSpeedButtons() {
            speedBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const rate = parseFloat(btn.getAttribute('data-rate'));
                    currentRate = rate;
                    speedBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showMessage(`速度切换为 ${rate}x，播放/导出即生效`, 1500);
                    stopCurrentPlayback();
                });
            });
        }

        async function unlockAudioOnFirstTouch() {
            const resumeCtx = async () => {
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                    showMessage("现在能放了", 1000);
                }
                document.removeEventListener('touchstart', resumeCtx);
                document.removeEventListener('click', resumeCtx);
            };
            document.addEventListener('touchstart', resumeCtx, { once: true });
            document.addEventListener('click', resumeCtx, { once: true });
        }

        function init() {
            initAudioContext();
            bindSpeedButtons();
            setupDragAndDrop();
            playBtn.addEventListener('click', playPreview);
            stopBtn.addEventListener('click', stopPreview);
            exportBtn.addEventListener('click', () => exportSpeedAudio('download'));
            shareBtn.addEventListener('click', shareAudioFile);
            unlockAudioOnFirstTouch();
            document.querySelector('.speed-btn[data-rate="1.0"]').classList.add('active');
            currentRate = 1.0;
        }

        init();
    })();
</script>
</body>
</html>
